# Canonicalizar www hacia el dominio raíz.
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name www.nexusneaker.store;

    ssl_certificate     /etc/letsencrypt/live/nexusneaker.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusneaker.store/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://nexusneaker.store$request_uri;
}

# Nexus Luxury Footwear - Django/Gunicorn reverse proxy
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name nexusneaker.store;

    ssl_certificate     /etc/letsencrypt/live/nexusneaker.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusneaker.store/privkey.pem;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://nexus_sneakers_web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }

    error_log /var/log/nginx/nexusneaker_error.log;
    access_log /var/log/nginx/nexusneaker_access.log;
}
