services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juaco_store}
      POSTGRES_USER: ${POSTGRES_USER:-juaco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juaco_dev_password}
    volumes:
      - juaco_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juaco} -d ${POSTGRES_DB:-juaco_store}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juaco_store}
      POSTGRES_USER: ${POSTGRES_USER:-juaco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juaco_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  juaco_postgres_data:
