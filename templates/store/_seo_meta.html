<meta name="description" content="{{ seo_description }}">
<meta name="author" content="Nexus Luxury Footwear">
<meta name="robots" content="{{ seo_robots }}">
<link rel="canonical" href="{{ seo_canonical_url }}">

<meta property="og:locale" content="es_CO">
<meta property="og:type" content="{{ seo_type }}">
<meta property="og:site_name" content="Nexus Luxury Footwear">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_canonical_url }}">
<meta property="og:image" content="{{ seo_image_url }}">
<meta property="og:image:secure_url" content="{{ seo_image_url }}">
{% if seo_image_width %}<meta property="og:image:width" content="{{ seo_image_width }}">
<meta property="og:image:height" content="{{ seo_image_height }}">{% endif %}
<meta property="og:image:alt" content="{{ seo_title }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ seo_image_url }}">
{% if seo_schema_json %}<script type="application/ld+json">{{ seo_schema_json|safe }}</script>{% endif %}
