{% extends "store/base.html" %}
{% block title %}Contraseña actualizada - Nexus Luxury Footwear{% endblock %}
{% block content %}
<section class="password-reset-area">
  <div class="container">
    <div class="password-reset-card password-reset-card--centered">
      <span class="password-reset-status-icon fa fa-check" aria-hidden="true"></span>
      <h1>Contraseña actualizada</h1>
      <p>Tu nueva contraseña quedó guardada. Ya puedes iniciar sesión de forma segura.</p>
      <a class="btn-theme" href="{% url 'login' %}">Iniciar sesión</a>
    </div>
  </div>
</section>
{% endblock %}
