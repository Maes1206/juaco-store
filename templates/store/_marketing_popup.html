{% if marketing_popup %}
<div class="marketing-popup-overlay" data-marketing-popup data-popup-key="juaco-popup-{{ marketing_popup.id }}-{{ marketing_popup.updated_at|date:'U' }}" data-popup-delay="{{ marketing_popup.delay_seconds }}" hidden>
  <section class="marketing-popup marketing-popup--image-{{ marketing_popup.image_position }}" role="dialog" aria-modal="true" aria-labelledby="marketing-popup-title-{{ marketing_popup.id }}">
    <button class="marketing-popup__close" type="button" data-popup-close aria-label="Cerrar popup"><i class="fa fa-times"></i></button>
    <div class="marketing-popup__image">{% if marketing_popup.is_video %}<video src="{{ marketing_popup.image_source }}" autoplay muted loop playsinline preload="metadata" aria-label="{{ marketing_popup.title }}"></video>{% else %}<img src="{{ marketing_popup.image_source }}" alt="{{ marketing_popup.title }}">{% endif %}</div>
    <div class="marketing-popup__content"><span>Nexus Luxury Footwear</span><h2 id="marketing-popup-title-{{ marketing_popup.id }}">{{ marketing_popup.title }}</h2><p>{{ marketing_popup.message|linebreaksbr }}</p><a href="{{ marketing_popup.button_url }}">{{ marketing_popup.button_label }}</a></div>
  </section>
</div>
<script>
(function () {
  var overlay = document.querySelector('[data-marketing-popup]');
  if (!overlay) return;
  var key = overlay.getAttribute('data-popup-key');
  try { if (window.sessionStorage.getItem(key)) return; } catch (error) {}
  var closePopup = function () {
    overlay.hidden = true;
    document.body.classList.remove('marketing-popup-open');
    try { window.sessionStorage.setItem(key, 'closed'); } catch (error) {}
  };
  overlay.addEventListener('click', function (event) { if (event.target === overlay || event.target.closest('[data-popup-close]')) closePopup(); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && !overlay.hidden) closePopup(); });
  window.setTimeout(function () { overlay.hidden = false; document.body.classList.add('marketing-popup-open'); }, Math.min(Number(overlay.getAttribute('data-popup-delay')) || 0, 30) * 1000);
}());
</script>
{% endif %}
